<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorldClaim</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;

            background: white;
            padding: 12px 18px;
            border-radius: 10px;

            font-size: 22px;
            font-weight: bold;

            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="title">
        🌍 WorldClaim
    </div>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map
        const map = L.map("map").setView([20, 0], 2);

        // Add map background
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        // Temporary message
        L.popup()
            .setLatLng([20, 0])
            .setContent(
                "<b>Welcome to WorldClaim!</b><br>Select a province to view it."
            )
            .openOn(map);
    </script>

</body>
</html>
